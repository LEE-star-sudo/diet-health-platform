services:
  jobmanager:
    image: flink:1.17.2-scala_2.12-java11
    container_name: flink_jobmanager
    restart: always
    network_mode: "host"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: 192.168.164.128
        rest.port: 8081
    command: jobmanager

  taskmanager:
    image: flink:1.17.2-scala_2.12-java11
    container_name: flink_taskmanager
    restart: always
    network_mode: "host"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: 192.168.164.128
        taskmanager.numberOfTaskSlots: 4
    command: taskmanager
